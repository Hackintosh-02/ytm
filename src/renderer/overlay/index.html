<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YTM Lyrics</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div id="drag-handle"></div>
    <div id="controls">
      <button id="btn-settings" title="Settings">⚙</button>
    </div>
    <div id="panel">
      <label>Font size <input id="in-font" type="range" min="12" max="36" step="1" /></label>
      <label>Opacity <input id="in-opacity" type="range" min="0" max="1" step="0.05" /></label>
      <label>Offset (s) <input id="in-offset" type="range" min="-5" max="5" step="0.1" /></label>
      <label style="justify-content:flex-end; font-family: monospace;" id="offset-readout"></label>
    </div>
    <div id="status">Waiting for a song…</div>
    <div id="lyrics"></div>
    <script src="./overlay.js"></script>
  </body>
</html>
